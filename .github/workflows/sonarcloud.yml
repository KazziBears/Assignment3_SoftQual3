name: SonarQube C++ Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-and-analyze:
    name: Build, Test, and Analyze
    runs-on: windows-latest

    env:
      BUILD_WRAPPER_OUT_DIR: bw-output

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Visual Studio Environment Config
        uses: microsoft/setup-msbuild@4a0e9d13ed7d0ec288b80fede6bd0a1412fdbd1c

      - name: Install Build Wrapper
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@4a0e9d13ed7d0ec288b80fede6bd0a1412fdbd1c

      - name: Build Project
        shell: powershell
        run: |
          $solution = Get-ChildItem -Path . -Recurse -Filter "*.slnx" |
            Select-Object -First 1

          if (-not $solution) {
            throw "No Visual Studio solution (.slnx) found. Upload your solution to GitHub."
          }

          Write-Host "Building solution: $($solution.FullName)"

          build-wrapper-win-x86-64.exe `
            --out-dir bw-output `
            msbuild $solution.FullName `
            /t:Rebuild `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /nodeReuse:False

          if ($LASTEXITCODE -ne 0) {
            throw "C++ solution build failed."
          }
        
      - name: Run C++ Unit Tests
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vstest = & $vswhere -latest -products '*' -find '**\vstest.console.exe' |
            Select-Object -First 1

          if (-not $vstest) {
            throw "Visual Studio Test Console was not found."
          }

          $testDll = Get-ChildItem -Path . -Recurse `
            -Filter "StudentRecordTests.dll" |
            Select-Object -First 1

          if (-not $testDll) {
            throw "StudentRecordTests.dll was not found. Check your test project."
          }

          Write-Host "Running tests: $($testDll.FullName)"

          & $vstest $testDll.FullName

          if ($LASTEXITCODE -ne 0) {
            throw "One or more C++ unit tests failed."
          }
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4a0e9d13ed7d0ec288b80fede6bd0a1412fdbd1c
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.cfamily.build-wrapper-output=bw-output
